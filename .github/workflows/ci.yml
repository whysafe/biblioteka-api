name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify: юнит-тесты (surefire) и интеграционные *IT на PostgreSQL в Testcontainers (failsafe)
      - run: ./mvnw -B verify
      - name: Docker image builds
        run: docker build -t biblioteka-api .
